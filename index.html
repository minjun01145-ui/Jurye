<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>주례여중 오락실</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  </head>
  <body>
    <div id="roaming-emojis" style="position:fixed; bottom:0; left:0; width:100%; height:150px; pointer-events:none; z-index:900;"></div>
    <div id="huge-countdown-overlay"><div id="huge-text" class="huge-text">5</div></div>
    
    <div id="auth-screen" class="screen active">
      <h1>👾 주례여중 오락실 👾</h1>
      <div class="n-box">
        <p id="db-msg" style="font-size:14px; color:#FF4081;">서버 확인 중...⏳</p>
        <input type="number" id="auth-id" class="n-input" placeholder="학번" />
        <input type="text" id="auth-name" class="n-input" placeholder="이름" />
        <button id="auth-btn" class="n-btn" disabled>대기...</button>
      </div>
    </div>
    
    <div id="login-screen" class="screen">
      <h1>😎 프로필</h1>
      <div class="n-box">
        <input type="text" id="nickname" class="n-input" placeholder="닉네임" />
        <div id="emoji-container"></div>
        <button id="login-btn" class="n-btn btn-cyan">오락실 입장!</button>
      </div>
    </div>

    <div id="hub-screen" class="screen">
      <h1>어디로 갈까요?</h1>
      <div class="n-box">
        <button id="btn-singleplayer" class="n-btn btn-green">👤 혼자 연습하기</button>
        <button id="btn-multiplayer" class="n-btn btn-orange">🌐 라이브 접속</button>
      </div>
    </div>

    <script type="module" src="index.mjs"></script>
  </body>
</html>
