<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>주례여중 펑키 오락실</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
      .swal2-popup { font-family: 'Jua', sans-serif !important; border: 3px solid #333 !important; border-radius: 15px !important; box-shadow: 5px 5px 0 #333 !important; }
      .swal2-confirm { background: #FFEB3B !important; color: #333 !important; border: 2px solid #333 !important; box-shadow: 2px 2px 0 #333 !important;}
    </style>
  </head>
  <body>
    <div id="roaming-emojis" style="position:fixed; bottom:0; left:0; width:100%; height:60px; pointer-events:none; z-index:900; overflow:hidden;"></div>

    <div id="huge-countdown-overlay"><div id="huge-text" class="huge-text">5</div></div>
    
    <div id="top-left-controls" style="display: none; position: fixed; top: 10px; left: 10px; z-index: 350; gap: 5px;">
      <button id="back-to-menu-btn" class="n-btn btn-small btn-gray">⬅️ 나가기</button>
      <button id="mute-btn" class="n-btn btn-small btn-gray">🔊 소리</button>
    </div>

    <div id="auth-screen" class="screen active">
      <h1>👾 주례여중 오락실 👾</h1>
      <div class="n-box" style="margin-top: 20px;">
        <h3 style="margin-bottom: 15px;">학번과 이름을 입력하세요</h3>
        <input type="number" id="auth-id" class="n-input" placeholder="학번 (예: 3201)" />
        <input type="text" id="auth-name" class="n-input" placeholder="이름" />
        <button id="auth-btn" class="n-btn" disabled>서버 연결 중...⏳</button>
      </div>
    </div>

    <div id="login-screen" class="screen">
      <h1>😎 프로필 설정</h1>
      <div class="n-box">
        <input type="text" id="nickname" class="n-input" placeholder="닉네임 입력" />
        <h3>아이콘 선택!</h3>
        <div id="emoji-container"></div>
        <button id="login-btn" class="n-btn btn-cyan">오락실 입장!</button>
      </div>
    </div> 

    <div id="hub-screen" class="screen">
      <h1>어디로 갈까요?</h1>
      <div class="n-box">
        <button id="btn-singleplayer" class="n-btn btn-green">👤 혼자 연습하기</button>
        <button id="btn-multiplayer" class="n-btn btn-orange">🌐 라이브 접속!</button>
      </div>
      <button id="btn-hub-admin" class="n-btn btn-gray btn-small" style="margin-top:20px;">⚙️ 선생님 메뉴</button>
    </div>

    <div id="lobby-screen" class="screen">
      <h2>🌐 라이브 대기실</h2>
      <div class="n-box" style="background-color: #FFF9C4; padding: 10px;">
        <div id="lobby-game-info" style="font-size: 16px;">선생님이 방을 설정 중입니다...</div>
      </div>
      <div class="n-box" style="padding: 10px;">
        <div style="font-size:14px; margin-bottom:5px; color:#888;">우리반 접속자 (<span id="lobby-user-count">0</span>명)</div>
        <div id="lobby-user-list" style="display: flex; flex-wrap: wrap; gap: 5px;"></div>
      </div>
      <div class="n-box flex-1" style="display:flex; flex-direction:column; overflow:hidden; padding: 10px;">
        <div id="lobby-chat-box" style="flex: 1; overflow-y: auto; text-align: left; display: flex; flex-direction: column; gap: 5px;"></div>
        <div class="flex-row" style="margin-top: 10px;">
          <input type="text" id="lobby-chat-input" class="n-input flex-1" style="margin:0; font-size:16px; padding:8px;" placeholder="채팅 입력!" autocomplete="off"/>
          <button id="lobby-chat-send-btn" class="n-btn btn-cyan btn-small" style="margin:0;">전송</button>
        </div>
      </div>
    </div>

    <div id="admin-main-screen" class="screen">
      <h2>⚙️ 관리자 메뉴</h2>
      <div class="n-box menu-grid">
        <button id="admin-go-live-btn" class="n-btn full btn-pink">🌐 라이브 컨트롤 룸</button>
        <button id="admin-go-student-btn" class="n-btn">👥 학생 DB</button>
        <button id="admin-go-set-btn" class="n-btn">📚 단어장 DB</button>
      </div>
      <button id="admin-main-close-btn" class="n-btn btn-gray">⬅️ 허브로</button>
    </div>

    <div id="admin-lobby-screen" class="screen">
      <h2>⚙️ 통제실</h2>
      <div class="n-box" style="padding: 10px; text-align:center;">
        <select id="admin-live-set" class="n-input" style="width:100%; font-size:16px; padding:5px;"></select>
        <div class="flex-row">
          <select id="admin-live-mode" class="n-input flex-1" style="font-size:16px; padding:5px;"><option value="speed-match">스피드 짝맞추기</option></select>
          <select id="admin-live-time" class="n-input flex-1" style="font-size:16px; padding:5px;"><option value="60">1분</option><option value="180" selected>3분</option></select>
        </div>
        <div class="flex-row">
          <select id="admin-live-team" class="n-input flex-1" style="font-size:16px; padding:5px;"><option value="indiv">개인전</option></select>
          <select id="admin-live-item" class="n-input flex-1" style="font-size:16px; padding:5px;"><option value="false">아이템 X</option><option value="true">아이템 O</option></select>
        </div>
        <button id="admin-live-start-btn" class="n-btn btn-pink" style="width:100%;">🚀 모든 학생 게임 강제시작!</button>
      </div>
      <button id="admin-lobby-leave-btn" class="n-btn btn-gray">⬅️ 방 폭파 후 나가기</button>
    </div>

    <div id="admin-live-monitor-screen" class="screen">
      <h2>📊 라이브 중계석</h2>
      <h3 id="admin-live-status-text" style="color: #FF4081;">대기 중...</h3>
      <div id="admin-live-rank-container" class="n-box" style="height: 50vh; position: relative; padding: 10px; overflow-x:hidden;"></div>
      <button id="admin-live-end-btn" class="n-btn btn-pink">⏹️ 게임 강제 종료</button>
    </div>

    <div id="set-select-screen" class="screen">
      <h2>📚 단어장 선택</h2>
      <div id="set-select-list" class="n-box" style="display:flex; flex-direction:column; gap:10px; max-height:50vh; overflow-y:auto; padding:10px;"></div>
      <button id="set-select-back-to-hub-btn" class="n-btn btn-gray">⬅️ 허브로</button>
    </div>

    <div id="menu-screen" class="screen">
      <h3 style="color:#FF4081;">내 이름은 <span id="user-display"></span></h3>
      <div class="n-box menu-grid">
        <button id="menu-list-btn" class="n-btn full btn-green">📋 학습 목록 보기</button>
        <button id="menu-exam-btn" class="n-btn full btn-purple">📝 시험대비 모드</button>
        <div class="flex-row"><button id="menu-speed-match-btn" class="n-btn btn-orange flex-1">🧩 짝맞추기</button><button id="rank-speed-match-btn" class="n-btn btn-small">🏆</button></div>
        </div>
      <button id="menu-go-back-set-btn" class="n-btn btn-gray">⬅️ 단어장 변경</button>
    </div>

    <div id="speed-match-screen" class="screen">
      <div class="top-bar" style="position:relative;">
         <div id="live-sm-banner" style="display:none; position: absolute; left: 15px; top: -15px; background: #FF5722; color: white; padding: 2px 8px; border-radius: 5px; font-size:14px; font-weight: bold;">[라이브 모드]</div>
         <span id="sm-timer" class="stat-text" style="color:#FF9800">🕒 03:00</span>
         <span id="sm-score" class="stat-text">점수: 0</span>
      </div>
      <div style="height: 80%; width: 100%; max-width: 600px; display: flex; justify-content: center; gap: 8px;">
         <div id="sm-left-col" style="display: flex; flex-direction: column; gap: 8px; width: 49%;"></div>
         <div id="sm-right-col" style="display: flex; flex-direction: column; gap: 8px; width: 49%;"></div>
      </div>
    </div>

    <div id="result-screen" class="screen">
      <h1 class="pop-in">MISSION CLEAR!</h1>
      <h2 id="result-user"></h2>
      <div class="n-box"><p style="font-size:20px; margin:0;">최종 점수</p><p id="final-score" style="font-size:40px; color:#00BCD4; margin:10px 0;">0</p></div>
      <button id="go-ranking-btn" class="n-btn btn-yellow">🏆 랭킹 보기</button>
      <button id="home-btn" class="n-btn btn-gray">⬅️ 허브로</button>
    </div>

    <div id="ranking-screen" class="screen">
      <h2>🏆 순위표 🏆</h2>
      <h3 id="ranking-mode-title" style="color: #FF4081; margin-bottom: 10px;"></h3>
      <div class="flex-row" style="margin-bottom: 10px; max-width:450px;"><button class="n-btn btn-small btn-orange flex-1" id="tab-today">오늘</button><button class="n-btn btn-small btn-gray flex-1" id="tab-class">우리반</button></div>
      <div id="ranking-list" class="n-box" style="height: 45vh; overflow-y: auto; text-align: left; padding:5px;"></div>
      <button id="ranking-home-btn" class="n-btn btn-green">⬅️ 돌아가기</button>
    </div>

    <div id="list-screen" class="screen"><h2 id="list-title">목록</h2><div class="flex-row" style="width:90%; max-width:450px;"><button id="toggle-word-btn" class="n-btn btn-purple btn-small flex-1">영어 가리기</button><button id="toggle-mean-btn" class="n-btn btn-orange btn-small flex-1">뜻 가리기</button></div><div id="word-list-container" class="n-box" style="height: 55vh; overflow-y: auto;"></div><button id="list-back-btn" class="n-btn btn-gray">⬅️ 돌아가기</button></div>
    <div id="exam-option-screen" class="screen"><h2>📝 시험대비</h2><div class="n-box menu-grid"><button id="exam1-btn" class="n-btn btn-cyan">1. 순서맞추기</button><button id="rank-exam1-btn" class="n-btn">🏆</button><button id="exam2-btn" class="n-btn btn-pink">2. 직접쓰기</button><button id="rank-exam2-btn" class="n-btn">🏆</button></div><button id="exam-option-back-btn" class="n-btn btn-gray">⬅️ 돌아가기</button></div>
    <div id="exam1-screen" class="screen"><div class="top-bar"><span id="exam1-progress" class="stat-text">1/10</span><span id="exam1-score" class="stat-text">점수: 0</span></div><div id="exam1-ko" class="n-box" style="font-size:20px; font-weight:bold;">한글</div><div id="exam1-slots" class="n-box" style="display:flex; flex-wrap:wrap; gap:8px; min-height:60px; border-style:dashed;"></div><div id="exam1-pool" class="n-box" style="display:flex; flex-wrap:wrap; gap:8px; min-height:60px; background:#f4f4f0;"></div><button id="exam1-submit-btn" class="n-btn btn-green" style="display:none;">정답 확인!</button></div>
    <div id="exam2-screen" class="screen"><div class="top-bar"><span id="exam2-progress" class="stat-text">1/10</span><span id="exam2-score" class="stat-text">점수: 0</span></div><div id="exam2-ko" class="n-box" style="font-size:20px; font-weight:bold;">한글</div><input type="text" id="exam2-input" class="n-input" placeholder="영어로 쓰세요!" autocomplete="off" spellcheck="false"/><button id="exam2-submit-btn" class="n-btn btn-green">정답 제출!</button></div>
    <div id="admin-student-screen" class="screen"><h2>👥 학생 DB</h2><textarea id="admin-student-textarea" class="n-input" style="height:150px; text-align:left;"></textarea><button id="admin-student-upload-btn" class="n-btn btn-cyan">업로드</button><div id="admin-student-list" class="n-box" style="height:20vh; overflow-y:auto;"></div><button id="admin-student-back-btn" class="n-btn">뒤로</button></div>
    <div id="admin-set-list-screen" class="screen"><h2>📚 단어장 DB</h2><button id="admin-set-create-btn" class="n-btn btn-purple">+ 새 단어장</button><div id="admin-set-list" class="n-box" style="height:30vh; overflow-y:auto;"></div><button id="admin-set-list-back-btn" class="n-btn">뒤로</button></div>
    <div id="admin-set-edit-screen" class="screen"><h2>편집</h2><input type="text" id="admin-set-title" class="n-input" placeholder="이름" /><textarea id="admin-set-textarea" class="n-input" style="height:200px; text-align:left;"></textarea><div class="flex-row"><button id="admin-set-save-btn" class="n-btn btn-green flex-1">저장</button><button id="admin-set-edit-cancel-btn" class="n-btn btn-alert flex-1">취소</button></div></div>
    
    <script type="module" src="index.mjs"></script>
  </body>
</html>
