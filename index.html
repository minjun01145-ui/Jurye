<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>새 사이트로 이동 중...</title>

  <!-- JavaScript가 비활성화된 환경에서도 새 사이트로 이동 -->
  <meta
    http-equiv="refresh"
    content="0; url=https://v2react-jurye-classroom.web.app/"
  />

  <script>
    // 뒤로가기로 기존 사이트에 다시 들어오지 않도록 replace 사용
    window.location.replace("https://v2react-jurye-classroom.web.app/");
  </script>
</head>
<body>
  <p>새 사이트로 이동 중입니다.</p>
  <p>
    자동으로 이동하지 않으면
    <a href="https://v2react-jurye-classroom.web.app/">여기를 클릭하세요.</a>
  </p>
</body>
</html>
